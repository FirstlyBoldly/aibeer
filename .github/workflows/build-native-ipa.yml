# Builds the NATIVE iOS app as an unsigned .ipa on a GitHub macOS runner —
# no local Mac/Xcode required. Download the artifact from the run page and
# sign + install it on an iPhone with Sideloadly (Windows/macOS/Linux) or
# AltStore, using a free Apple ID.
#
# The .ipa is UNSIGNED: CODE_SIGNING_ALLOWED=NO. Sideloadly applies a free
# personal certificate at install time (7-day expiry, 3-app cap — Apple's
# free-tier rules, same as Xcode free provisioning).
name: build-native-ipa

on:
  push:
    branches: [main]
    paths:
      - "aibeer/**"
      - "BeerCore/**"
      - "shaders/**"
      - "project.yml"
      - ".github/workflows/build-native-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project aibeer.xcodeproj \
            -scheme aibeer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/aibeer.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Show compile errors (runs only on failure)
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -40 \
            || echo "no explicit 'error:' lines — see full build.log above"

      - name: Package unsigned .ipa
        run: |
          cd build
          mkdir Payload
          cp -R aibeer.xcarchive/Products/Applications/aibeer.app Payload/
          zip -qry aibeer-unsigned.ipa Payload

      - name: Verify archive contents
        run: |
          # Metal app: the binary plus default.metallib (beer.metal compiled
          # at build time). The GLSL beer-liquid.fsh is web-only now and is
          # intentionally NOT bundled.
          APP=build/aibeer.xcarchive/Products/Applications/aibeer.app
          test -f "$APP/aibeer"
          test -f "$APP/default.metallib"
          grep -q beerFragment "$APP/default.metallib"
          echo "app bundle contents:"
          ls -la "$APP"
          unzip -l build/aibeer-unsigned.ipa | grep -E "Payload/aibeer\.app/(aibeer|default\.metallib)"

      - uses: actions/upload-artifact@v4
        with:
          name: aibeer-unsigned-ipa
          path: build/aibeer-unsigned.ipa
          retention-days: 14

  # Visual smoke test: launch the app in an iOS Simulator and publish a
  # screenshot. A black screenshot = rendering failure (e.g. SKShader
  # transpile problem on Metal); beer = rendering pipeline healthy.
  simulate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Find an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^ (]*' | head -1)
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        run: |
          xcodebuild \
            -project aibeer.xcodeproj \
            -scheme aibeer \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath simdd \
            build CODE_SIGNING_ALLOWED=NO 2>&1 | tee simbuild.log

      - name: Boot, install, launch, screenshot
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.device }}" 2>/dev/null || true
          xcrun simctl install booted simdd/Build/Products/Debug-iphonesimulator/aibeer.app
          # AIBEER_DEBUG=1: the scene color-codes its lifecycle (red = didMove
          # only, blue = update() running) and prints live state in a label.
          SIMCTL_CHILD_AIBEER_DEBUG=1 xcrun simctl launch booted dev.aibeer.app
          sleep 6
          xcrun simctl io booted screenshot sim-shot.png
          # SpriteKit logs shader compile failures here:
          xcrun simctl spawn booted log show --last 30s --style compact \
            --predicate 'processImagePath CONTAINS "aibeer"' > device-log.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: sim-screenshot
          path: sim-shot.png
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: sim-device-log
          path: device-log.txt
          retention-days: 14
