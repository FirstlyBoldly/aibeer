<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>aibeer — shader preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden;
               font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hint { position: fixed; top: 10px; left: 0; right: 0; text-align: center;
          color: rgba(255,255,255,.4); font-size: 12px; pointer-events: none; }
  body.clean #hint, body.clean #drink { display: none; }
  #drink { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
           color: rgba(255,255,255,.55); font-size: 13px; letter-spacing: .08em;
           text-transform: uppercase; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to tilt &middot; swipe left / right to change drink &middot; keys: arrows tilt</div>
<div id="drink"></div>
<script>
"use strict";
// The placeholders below are filled in by tools/embed.mjs at build time
// (shader body from shaders/beer-liquid.fsh, style presets from BeerCore,
// shared runtime from shared/runtime.js).
__RUNTIME__
const FRAG_BODY = `__SHADER_BODY__`;
const STYLES = __STYLES_JSON__;

(() => {
  const qs = new URLSearchParams(location.search);
  if (qs.get("clean")) document.body.classList.add("clean");

  const drinkLabel = document.getElementById("drink");
  window.__aibeer = createAibeer({
    canvas: document.getElementById("c"),
    fragBody: FRAG_BODY,
    styles: STYLES,
    initial: {
      styleId: qs.get("style"),
      fill: parseFloat(qs.get("fill")),
      deg: parseFloat(qs.get("deg")),
      wobble: parseFloat(qs.get("wobble")),
      freeze: !!qs.get("freeze"),
      kick: !!qs.get("kick")
    },
    onStyleChange: style => { drinkLabel.textContent = style.name; }
  });
  drinkLabel.textContent = window.__aibeer.state.style.name;
})();
</script>
</body>
</html>
