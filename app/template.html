<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="aiBeer">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<title>aiBeer</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden;
               font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
               -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #perm { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          background: rgba(3,4,8,.72); z-index: 10; cursor: pointer; }
  #perm button { font-size: 16px; padding: 12px 26px; }
  #perm.hidden { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="perm">
  <button id="enableTilt">Enable tilt</button>
</div>
<script>
"use strict";
// The placeholders below are filled in by tools/embed.mjs at build time
// (shader body from shaders/beer-liquid.fsh, style presets from BeerCore,
// shared runtime from shared/runtime.js).
__RUNTIME__
const FRAG_BODY = `__SHADER_BODY__`;
const STYLES = __STYLES_JSON__;

(() => {
  const qs = new URLSearchParams(location.search);
  const perm = document.getElementById("perm");

  // ---- gyroscope → screen-space world-down (the PWA's gravityProvider) ----
  // deviceorientation (W3C, ZXY order): beta = x tilt, gamma = y tilt.
  // World-down in the device frame: (sin γ·cos β, −sin β, −cos γ·cos β).
  // We project onto the screen plane and rotate by the UI orientation angle,
  // mirroring BeerCore's unit-tested GravityProjector. The provider returns
  // [x, y, tiltOff] where tiltOff = |g.z| drives the tilt-drain mechanic.
  let gyroDir = null;         // [x, y, tiltOff], null until attached
  let lastDir = [0, -1];      // held when the phone lies flat (degenerate)
  function onOrientation(e) {
    if (e.beta == null) return;
    const b = (e.beta || 0) * Math.PI / 180;
    const g = (e.gamma || 0) * Math.PI / 180;
    const gx = Math.sin(g) * Math.cos(b);   // device x (right, portrait)
    const gy = -Math.sin(b);                // device y (top, portrait)
    const angle = (((screen.orientation && screen.orientation.angle)
      || window.orientation || 0) % 360 + 360) % 360;
    let dx, dy;                             // screen coords, y-up
    switch (angle) {
      case 90:  dx = -gy;  dy = gx;  break;   // landscapeLeft (home right)
      case 180: dx = -gx;  dy = -gy; break;   // portrait upside down
      case 270: dx = gy;   dy = -gx; break;   // landscapeRight (home left)
      default:  dx = gx;   dy = gy;  break;   // portrait
    }
    const len = Math.hypot(dx, dy);
    if (len > 0.05) lastDir = [dx / len, dy / len];   // degenerate when flat → hold
    gyroDir = [lastDir[0], lastDir[1], Math.abs(Math.cos(g) * Math.cos(b))];
  }

  function attachGyro() {
    window.addEventListener("deviceorientation", onOrientation, true);
  }

  async function requestGyro() {
    // iOS 13+ requires an explicit user-gesture permission request.
    // Any failure (denied, no sensors, no data) falls back silently to
    // drag-to-tilt.
    if (typeof DeviceOrientationEvent !== "undefined"
        && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== "granted") return false;
      } catch (err) {
        return false;
      }
    }
    if (typeof DeviceOrientationEvent === "undefined") return false;
    attachGyro();
    // If no events arrive within 1.5 s (desktop browser), fall back to drag.
    const hadEvents = await new Promise(res => {
      let got = false;
      const probe = e => { if (e.beta != null) { got = true; } };
      window.addEventListener("deviceorientation", probe, true);
      setTimeout(() => {
        window.removeEventListener("deviceorientation", probe, true);
        res(got);
      }, 1500);
    });
    if (!hadEvents) gyroDir = null;
    return hadEvents;
  }

  const enableBtn = document.getElementById("enableTilt");
  enableBtn.addEventListener("click", async () => {
    await requestGyro();
    perm.classList.add("hidden");
  });

  const app = createAibeer({
    canvas: document.getElementById("c"),
    fragBody: FRAG_BODY,
    styles: STYLES,
    initial: {
      styleId: qs.get("style"),
      fill: parseFloat(qs.get("fill")),
      deg: parseFloat(qs.get("deg")),
      wobble: parseFloat(qs.get("wobble")),
      freeze: !!qs.get("freeze"),
      kick: !!qs.get("kick")
    },
    gravityProvider: () => gyroDir
  });
  window.__aibeer = app;   // debug/testing hook

  // Service worker (production, HTTPS only — skipped for file:// dev).
  if ("serviceWorker" in navigator
      && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
